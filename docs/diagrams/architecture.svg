<g transform="translate(36 324)"><rect class="b" width="372" height="30" rx="6"/><text class="k" x="12" y="20">COMPONENT</text><text class="h" x="85" y="20">Agent (local git)</text></g>
<g transform="translate(36 270)"><rect class="f" width="372" height="30" rx="6"/><text class="k" x="12" y="20">COMPONENT</text><text class="h" x="85" y="20">Browser: CM6 + Automerge replica</text></g>
<g transform="translate(736 62)"><rect class="b" width="246" height="30" rx="6"/><text class="k" x="12" y="20">COMPONENT</text><text class="h" x="85" y="20">sync relay</text></g>
<g transform="translate(736 116)"><rect class="b" width="246" height="30" rx="6"/><text class="k" x="12" y="20">COMPONENT</text><text class="h" x="85" y="20">OAuth exchange fn</text></g>
<g transform="translate(736 440)"><rect class="f" width="431" height="102" rx="6"/><text class="k" x="12" y="20">REF</text><text class="h" x="43" y="20">refs/heads/&lt;branch></text><text class="c" x="12" y="46">&lt;path></text><text class="t" x="419" y="46">markdown</text><text class="c" x="12" y="70">&lt;!--rl:id-->…&lt;!--/rl:id--></text><text class="t" x="419" y="70">comment range</text><text class="c" x="12" y="94">&lt;!--rl:id @login: … --></text><text class="t" x="419" y="94">thread, at doc end</text><path class="r" d="M0 30h431M0 54h431M0 78h431"/></g>
<g transform="translate(736 338)"><rect class="b" width="431" height="78" rx="6"/><text class="k" x="12" y="20">REF</text><text class="h" x="43" y="20">refs/red-letter/v1/&lt;sha1 branch>/&lt;sha1 path></text><text class="c" x="12" y="46">doc.automerge</text><text class="t" x="419" y="46">blob</text><text class="c" x="12" y="70">meta.json</text><text class="t" x="419" y="70">docId, commit, heads</text><path class="r" d="M0 30h431M0 54h431"/></g>
<g transform="translate(736 236)"><rect class="b" width="431" height="78" rx="6"/><text class="k" x="12" y="20">BRANCH</text><text class="h" x="64" y="20">red-letter/comments/&lt;sha1 branch>/&lt;sha1 path></text><text class="c" x="12" y="46">&lt;path></text><text class="t" x="419" y="46">doc + new comments</text><text class="c" x="12" y="70">open PR</text><text class="t" x="419" y="70">into a protected &lt;branch></text><path class="r" d="M0 30h431M0 54h431"/></g>
<circle class="d" cx="408" cy="339" r="3"/>
