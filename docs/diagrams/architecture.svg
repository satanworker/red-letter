<svg viewBox="0 0 1235 610" xmlns="http://www.w3.org/2000/svg" font-family="Berkeley Mono,Menlo,monospace">
<style>.g{fill:var(--fg);fill-opacity:.025;stroke:var(--border)}
.b{fill:var(--fg);fill-opacity:.035;stroke:var(--border)}.f{fill:var(--accent);fill-opacity:.07;stroke:var(--accent);stroke-width:1.6}
.r{fill:none;stroke:var(--border)}.s{fill:url(#s)}
.k{font-size:9px;letter-spacing:1.5px;fill:var(--muted)}.h{font-size:13px;font-weight:bold;fill:var(--fg)}
.c{font-size:12px;fill:var(--fg)}.t{font-size:10.5px;fill:var(--muted);text-anchor:end}.m{font-size:10.5px;fill:var(--muted)}
.e{fill:none;stroke:var(--muted);stroke-width:1.1;stroke-opacity:.8}.ea{fill:none;stroke:var(--accent);stroke-width:1.6}
.d{fill:var(--muted)}
.lb{fill:var(--surface);stroke:var(--border)}.la{fill:var(--surface);stroke:var(--accent)}.lt{font-size:10.5px;fill:var(--muted);text-anchor:middle}</style>
<defs><pattern id="s" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="10" fill="var(--accent)" fill-opacity=".16"/></pattern>
<marker id="m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--muted)"/></marker>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--accent)"/></marker>
<g id="PK"><rect width="22" height="16" rx="3" fill="var(--warning)" fill-opacity=".18"/><text x="11" y="12" font-size="9" font-weight="bold" text-anchor="middle" fill="var(--warning)">PK</text></g>
<g id="FK"><rect width="22" height="16" rx="3" fill="var(--accent)" fill-opacity=".18"/><text x="11" y="12" font-size="9" font-weight="bold" text-anchor="middle" fill="var(--accent)">FK</text></g></defs>
<g transform="translate(16 16)">
<rect class="g" x="16" y="224" width="412" height="150" rx="8"/><text class="k" x="32" y="248">CLIENTS</text><text class="h" x="93" y="248">Clients</text>
<rect class="g" x="716" y="16" width="286" height="150" rx="8"/><text class="k" x="732" y="40">STATELESS</text><text class="h" x="807" y="40">Infra you run (no state, no keys)</text>
<rect class="g" x="716" y="190" width="471" height="372" rx="8"/><text class="k" x="732" y="214">DATABASE</text><text class="h" x="800" y="214">GitHub (only state)</text>
