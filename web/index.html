<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Letter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='3' y='13' font-size='14' font-family='Georgia' fill='%23c0392b'>¶</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@300;400;500&family=Grandstander&display=swap">
<style>
  /* Figma "Red Letter": Onyx #373737, Middle Grey #EBEBEB, Dark Grey #D8D8D8, Shadows #ADADAD, Google Sans Code. */
  :root {
    color-scheme: light dark;
    --bg: #fff; --side: #ebebeb; --card: #fff; --bg2: #f5f5f5;
    --fg: #373737; --muted: #adadad; --faint: #adadad; --mark: #d8d8d8;
    --line: #adadad; --rule: #d8d8d8; --hover: rgba(55, 55, 55, .06); --on: #d9d9d9;
    --blue: #2383e2; --red: #c4342d; --red-bg: #fdebec; --del: #9f2f2d; --green-bg: #edf3ec; --green: #448361; --yellow-bg: rgba(255, 212, 0, .14); --yellow: #dfab01;
    --brand: #fe0000; --code: #ee8181; --code-bg: rgba(55, 55, 55, .06); --av-bg: #d8d8d8; --av-fg: #373737; --sel: rgba(0, 64, 255, .5);
    --glass: rgba(235, 235, 235, .5);
    --shadow: 0 .5px 3px rgba(55, 55, 55, .09), 0 4px 10px rgba(235, 235, 235, .25), inset 0 -.5px 1px rgba(0, 0, 0, .05);
    --pop: rgba(15, 15, 15, .05) 0 0 0 1px, rgba(15, 15, 15, .1) 0 3px 6px, rgba(15, 15, 15, .2) 0 9px 24px;
    --sans: "Google Sans Code", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919; --side: #202020; --card: #252525; --bg2: #2a2a2a;
      --fg: rgba(255, 255, 255, .86); --muted: rgba(255, 255, 255, .45); --faint: rgba(255, 255, 255, .45); --mark: rgba(255, 255, 255, .25);
      --line: rgba(255, 255, 255, .2); --rule: rgba(255, 255, 255, .12); --hover: rgba(255, 255, 255, .06); --on: rgba(255, 255, 255, .1);
      --red: #e5534b; --red-bg: #3e2523; --del: #f08a83; --green-bg: #22372b; --green: #6cc08f;
      --yellow-bg: rgba(255, 212, 0, .12); --code: #ff8f8f; --code-bg: rgba(255, 255, 255, .08); --av-bg: #3a3633; --av-fg: #d9c2b5;
      --sel: rgba(64, 120, 255, .45); --glass: rgba(60, 60, 60, .6);
      --shadow: 0 .5px 3px rgba(0, 0, 0, .3), inset 0 -.5px 1px rgba(255, 255, 255, .04);
      --pop: rgba(255, 255, 255, .08) 0 0 0 1px, rgba(0, 0, 0, .3) 0 3px 6px, rgba(0, 0, 0, .45) 0 9px 24px;
    }
    /* exported Figma icons are dark fills on light: flip them (the search glyph is already light grey) */
    .ic { filter: invert(1); }
    .search .ic { filter: none; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  [hidden] { display: none !important; }
  body { font: 12px/normal var(--sans); color: var(--fg); -webkit-font-smoothing: antialiased; background: var(--bg); }
  .ic { display: block; flex: none; }
  /* Figma's robot frame is 14px with the glyph inset 4.46% / 8% / 3.47% / 8% */
  .ic.robot { padding: .624px 1.12px .486px; }
  a { color: inherit; }
  code { font: 85%/1 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code-bg); color: var(--code); padding: 2px 4px; border-radius: 4px; }
  .red { color: var(--red); }
  .muted, .meta { color: var(--muted); }
  .meta { font-size: 12px; }
  .err { color: var(--red); }
  .warn { color: #d9730d; }
  .spacer { flex: 1; }
  .av.initial { display: inline-flex; align-items: center; justify-content: center; background: var(--av-bg); color: var(--av-fg); font-weight: 600; }
  .av { border-radius: 50%; vertical-align: middle; background: var(--bg2); flex: none; }

  /* buttons */
  /* Reply/Resolve: 24px tall, Figma width = text + 24 with the .4px stroke inside */
  .btn { font: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 24px; padding: 0 11.6px; border-radius: 14px;
    border: .4px solid var(--rule); background: var(--card); color: var(--fg); box-shadow: var(--shadow); cursor: pointer; white-space: nowrap; transition: background 20ms ease-in; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 500; }
  .btn.primary:hover { background: #0077d4; }
  .btn.ghost { border-color: transparent; background: none; box-shadow: none; color: var(--muted); padding: 0 4px; }
  .btn.ghost:hover { color: var(--fg); background: var(--hover); }
  .btn.small { height: 24px; padding: 0 8px; }
  .btn.big { height: 40px; padding: 0 18px; font-size: 14px; border-radius: 8px; }
  .btn.wide { width: 100%; }
  .btn.share { border-radius: 8px; border-color: var(--line); padding: 0 8px; }
  .btn.icon i, #count { font-style: normal; font-size: 12px; }
  .link { font: inherit; border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .link:hover { color: var(--fg); }
  .badge { font-style: normal; font-weight: 300; color: var(--muted); border: .4px solid var(--line); border-radius: 12px; padding: 0 3px; }

  /* landing / screens */
  .screen { min-height: 100vh; }
  .topnav { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px; }
  .logo { font: 18px/28px Grandstander, var(--sans); color: var(--brand); text-decoration: none; }
  .hero { max-width: 720px; margin: 12vh auto 0; padding: 0 24px; }
  .hero h1 { font-size: 48px; line-height: 1.1; letter-spacing: -.025em; font-weight: 700; margin: 0 0 18px; }
  .lede { font-size: 18px; line-height: 1.6; color: var(--muted); margin: 0 0 32px; }
  form.open { display: flex; gap: 8px; }
  form.open input { flex: 1; height: 40px; font: inherit; font-size: 15px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg2); outline: none; }
  form.open input:focus { background: var(--bg); box-shadow: 0 0 0 2px rgba(35, 131, 226, .35); border-color: transparent; }
  form.open .btn { height: 40px; }
  .fine { font-size: 12.5px; color: var(--faint); margin: 10px 0; line-height: 1.5; }
  .fine a { color: var(--muted); }
  .signin { margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--line); }
  .card-lg { max-width: 460px; margin: 14vh auto 0; padding: 32px; border-radius: 10px; box-shadow: var(--pop); }
  .card-lg h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -.01em; }
  .card-lg p { color: var(--muted); }
  .loading { height: 100vh; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--muted); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #doc .loading { height: 60vh; }

  /* editor screen: px values are Figma "Desktop - 1" (1:8) coordinates. Figma strokes don't shift content: outlines, not borders. */
  .editor-screen { display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: flex-start; height: 35px; padding: 0 8px 0 16px; flex: none; white-space: nowrap;
    background: var(--side); outline: .5px solid var(--line); outline-offset: -.5px; box-shadow: var(--shadow); position: relative; z-index: 3; }
  /* columns line up with the 320px sidebar, the 800px doc and the 320px panel */
  header .brand { width: 304px; flex: none; display: flex; align-items: center; gap: 8px; }
  header .logo { margin-top: 7px; }
  .crumbs { width: 800px; flex: none; display: flex; align-items: center; min-width: 0; overflow: hidden; margin-top: 9px; }
  .crumb { text-decoration: none; overflow: hidden; text-overflow: ellipsis; }
  .crumb:hover { text-decoration: underline; }
  .pill { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; padding: 0 6px; border: .4px solid var(--line); border-radius: 12px; font-weight: 300; color: var(--muted); }
  .status { display: flex; gap: 12px; margin-top: 10px; }
  .status .dot { width: 8px; }
  .status a { color: inherit; }
  header .btn.ghost { margin-top: 5.5px; margin-right: 8px; }
  header .btn.share { margin-top: 5.6px; margin-right: 9.2px; }
  .people { display: inline-flex; margin: 5.5px 8px 0 0; }
  .people .av { margin-left: -6px; box-shadow: 0 0 0 2px var(--side); }
  .people .av:first-child { margin-left: 0; }
  .me { display: inline-flex; margin-top: 4px; }
  main { flex: 1; display: flex; min-height: 0; }
  #doc { flex: 1; min-width: 0; overflow: auto; background: var(--bg); }
  #editor .cm-editor { min-height: calc(100% - 20px); }
  /* the banner floats in the doc's 80px top padding instead of pushing the text down */
  #banner { position: sticky; top: 0; z-index: 5; height: 0; }
  .banner { max-width: 440px; margin: 8px auto 0; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px;
    background: var(--green-bg); color: var(--fg); box-shadow: var(--shadow); }
  .banner.bad { background: var(--red-bg); }
  .banner > span:not(.av) { flex: 1; }

  /* file sidebar */
  #files { width: 320px; flex: none; overflow: auto; background: var(--side); outline: .5px solid var(--line); outline-offset: -.5px; padding-bottom: 24px; }
  .files-bar { position: relative; height: 36px; padding: 8px 16px 0; }
  .files-bar .toggle { display: grid; place-items: start center; width: 28px; height: 21px; margin-left: -4px; padding: 0; border: 0; border-radius: 8px;
    background: var(--rule); box-shadow: var(--shadow); cursor: pointer; }
  .files-bar .btn.ghost { position: absolute; left: 233px; top: 9px; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 4px; }
  .files-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--side); }
  .search { flex: 1; min-width: 0; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--card);
    border: .4px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); }
  .search input, .new-file input { flex: 1; min-width: 0; font: inherit; color: var(--fg); border: 0; outline: none; background: none; padding: 0; }
  .search input::placeholder { color: var(--mark); }
  .new-file { padding: 0 16px 12px; }
  .new-file input { width: 100%; height: 28px; padding: 0 12px; background: var(--card); border: .4px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); }
  .new-file .fine { margin: 4px 0 0; }
  /* rows: 23px text rows 8px apart; the highlight is 25px, 1px past the row on each side */
  .tree, .flat { margin-top: -1px; }
  #files summary, #files .file { display: flex; align-items: center; gap: 8px; height: 25px; padding-right: 12px; margin: 0 4px 6px; border-radius: 4px;
    text-decoration: none; cursor: pointer; white-space: nowrap; list-style: none; }
  #files summary::-webkit-details-marker { display: none; }
  #files summary span, #files .file span { overflow: hidden; text-overflow: ellipsis; }
  #files summary:hover, #files .file:hover { box-shadow: inset 0 0 0 .5px var(--line), var(--shadow); }
  #files .file.on { background: var(--on); box-shadow: var(--shadow); }
  #files details:not([open]) > summary .open, #files details[open] > summary .closed { display: none; }
  .flat .file { height: auto !important; min-height: 25px; white-space: normal !important; padding: 5px 12px !important; }
  .empty-doc { max-width: 440px; margin: 20vh auto; padding: 0 24px; color: var(--muted); font-size: 14px; }

  /* side panel */
  aside { width: 320px; flex: none; overflow: auto; outline: .5px solid var(--line); outline-offset: -.5px; padding: 16px; background: var(--side); }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button { font: inherit; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 12px; border: .4px solid var(--line); border-radius: 14px;
    background: var(--side); color: var(--fg); box-shadow: var(--shadow); cursor: pointer; }
  .tabs button.on { background: var(--card); border: 0; padding: 0 16px; }
  #comments, #changes { display: flex; flex-direction: column; gap: 16px; }
  aside .fine { color: var(--muted); font-size: 12px; margin: 0; padding: 4px 0; }
  aside .fine code { display: block; margin-top: 8px; font: inherit; background: none; padding: 0; color: var(--code); overflow-wrap: anywhere; }
  .empty { color: var(--muted); padding: 12px 2px; margin: 0; }
  .card { background: var(--card); border-radius: 12px; padding: 24px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; cursor: default; }
  .card.thread, .card.compose { gap: 24px; }
  .card.thread { cursor: pointer; }
  .card.active { box-shadow: 0 0 0 2px rgba(223, 171, 1, .55), var(--shadow); }
  .who { display: flex; align-items: center; gap: 8px; }
  .who .name { display: flex; flex-direction: column; }
  .card .msg { color: var(--muted); }
  .card q { quotes: none; border-left: 2px solid var(--on); padding-left: 8px; color: var(--muted);
    white-space: pre-wrap; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .quote .meta { display: block; margin-top: 2px; }
  .c { display: flex; flex-direction: column; gap: 12px; }
  .c .body { white-space: pre-wrap; word-wrap: break-word; }
  .card textarea, .card input { width: 100%; font: inherit; color: var(--fg); border: 0; outline: none; resize: none; background: transparent; padding: 4px 0; }
  .compose .who { align-items: flex-start; }
  .actions { display: flex; align-items: center; gap: 12px; }
  .compose .actions { justify-content: flex-end; }
  .reply input { height: 28px; padding: 0 12px; border: .4px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); }
  .resolved summary { color: var(--muted); cursor: pointer; padding: 6px 2px; }
  .resolved[open] { display: flex; flex-direction: column; gap: 16px; }
  .hunk { border-top: .5px solid var(--rule); padding-top: 12px; cursor: pointer; display: flex; gap: 8px; align-items: flex-start; }
  .hunk .diff { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .hunk del { background: var(--red-bg); color: var(--del); text-decoration: line-through; border-radius: 3px; padding: 0 2px; margin-right: 4px; }
  .hunk ins { background: var(--green-bg); color: var(--green); text-decoration: none; border-radius: 3px; padding: 0 2px; }
  .hunk.conflict { display: block; }
  .hunk.conflict .label { color: var(--red); font-weight: 500; margin-bottom: 4px; }
  .hunk.conflict q { border-left-color: var(--red); }
  .choices { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .choices .btn { justify-content: flex-start; overflow: hidden; text-overflow: ellipsis; }

  /* in-editor marks */
  .rl-agent { background: var(--green-bg); box-shadow: 0 2px 0 rgba(68, 131, 97, .35); border-radius: 2px; }
  .rl-del { background: var(--red-bg); color: var(--del); text-decoration: line-through; border-radius: 2px; opacity: .8; }
  .rl-conflict { background: var(--red-bg); box-shadow: 0 2px 0 var(--red); }
  .rl-comment { background: var(--yellow-bg); box-shadow: 0 2px 0 rgba(223, 171, 1, .8); cursor: pointer; }
  .rl-comment.active { background: rgba(255, 212, 0, .4); }
  /* the tooltip dom is .sel-tip itself: drop CodeMirror's tooltip box */
  .cm-editor .cm-tooltip.sel-tip { display: flex; flex-direction: column; align-items: center; border: 0; background: none; }
  .sel-tip button { font: 12px var(--sans); color: var(--fg); padding: 8px 20px; border: 0; border-radius: 8px; background: var(--glass);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); box-shadow: var(--shadow); cursor: pointer; }
  .sel-tip button:hover { background: var(--hover); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="%ENTRY%"></script>
</body>
</html>
