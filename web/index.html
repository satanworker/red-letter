<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Letter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='3' y='13' font-size='14' font-family='Georgia' fill='%23c0392b'>¶</text></svg>">
<style>
  :root {
    --fg: #37352f; --muted: rgba(55, 53, 47, .65); --faint: rgba(55, 53, 47, .45);
    --line: rgba(55, 53, 47, .09); --hover: rgba(55, 53, 47, .06); --bg2: #f7f6f3;
    --blue: #2383e2; --red: #c4342d; --red-bg: #fdebec; --green-bg: #edf3ec; --green: #448361; --yellow-bg: rgba(255, 212, 0, .14); --yellow: #dfab01;
    --pop: rgba(15, 15, 15, .05) 0 0 0 1px, rgba(15, 15, 15, .1) 0 3px 6px, rgba(15, 15, 15, .2) 0 9px 24px;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 14px/1.5 var(--sans); color: var(--fg); -webkit-font-smoothing: antialiased; background: #fff; }
  a { color: inherit; }
  code { font: 85%/1 ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(135, 131, 120, .15); color: #eb5757; padding: 2px 4px; border-radius: 4px; }
  .red { color: var(--red); }
  .muted, .meta { color: var(--muted); }
  .meta { font-size: 12px; }
  .err { color: var(--red); }
  .warn { color: #d9730d; }
  .spacer { flex: 1; }
  .av.initial { display: inline-flex; align-items: center; justify-content: center; background: #e9e5e3; color: #64473a; font-weight: 600; }
  .av { border-radius: 50%; vertical-align: middle; background: var(--bg2); flex: none; }

  /* buttons */
  .btn { font: inherit; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; color: var(--fg); cursor: pointer; white-space: nowrap; transition: background 20ms ease-in; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 500; }
  .btn.primary:hover { background: #0077d4; }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--fg); }
  .btn.small { height: 24px; font-size: 12.5px; padding: 0 8px; }
  .btn.big { height: 40px; padding: 0 18px; font-size: 15px; }
  .btn.wide { width: 100%; justify-content: center; margin-top: 8px; }
  .btn.icon i, #count { font-style: normal; font-size: 12px; }
  .link { font: inherit; border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .link:hover { color: var(--fg); }

  /* landing / screens */
  .screen { min-height: 100vh; }
  .topnav { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px; }
  .logo { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; text-decoration: none; letter-spacing: -.01em; }
  .pilcrow { font-family: Georgia, "Times New Roman", serif; color: var(--red); font-size: 18px; line-height: 1; }
  .hero { max-width: 720px; margin: 12vh auto 0; padding: 0 24px; }
  .hero h1 { font-size: 48px; line-height: 1.1; letter-spacing: -.025em; font-weight: 700; margin: 0 0 18px; }
  .lede { font-size: 18px; line-height: 1.6; color: var(--muted); margin: 0 0 32px; }
  form.open { display: flex; gap: 8px; }
  form.open input { flex: 1; height: 40px; font: inherit; font-size: 15px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg2); outline: none; }
  form.open input:focus { background: #fff; box-shadow: 0 0 0 2px rgba(35, 131, 226, .35); border-color: transparent; }
  form.open .btn { height: 40px; }
  .fine { font-size: 12.5px; color: var(--faint); margin: 10px 0; line-height: 1.5; }
  .fine a { color: var(--muted); }
  .signin { margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--line); }
  .card-lg { max-width: 460px; margin: 14vh auto 0; padding: 32px; border-radius: 10px; box-shadow: var(--pop); }
  .card-lg h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -.01em; }
  .card-lg p { color: var(--muted); }
  .loading { height: 100vh; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--muted); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* editor screen */
  .editor-screen { display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; gap: 8px; height: 45px; padding: 0 12px; flex: none; white-space: nowrap; }
  header .logo { margin-right: 6px; }
  .crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; color: var(--muted); }
  .crumb { text-decoration: none; padding: 2px 6px; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; }
  .crumb:hover { background: var(--hover); }
  .crumb.file { color: var(--fg); }
  .sep { color: var(--faint); }
  .pill { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; padding: 1px 7px; border-radius: 10px; background: var(--bg2); font-size: 12px; color: var(--muted); }
  .status { color: var(--faint); font-size: 12.5px; margin-right: 4px; }
  .status a { color: inherit; }
  .people { display: inline-flex; }
  .people .av { margin-left: -6px; box-shadow: 0 0 0 2px #fff; }
  .people .av:first-child { margin-left: 0; }
  .me { margin-left: 4px; display: inline-flex; }
  main { flex: 1; display: flex; min-height: 0; }
  #doc { flex: 1; min-width: 0; overflow: auto; }
  #editor .cm-editor { min-height: calc(100% - 20px); }
  #banner { position: sticky; top: 0; z-index: 5; }
  .banner { max-width: 720px; margin: 8px auto 0; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px;
    background: var(--green-bg); color: var(--fg); font-size: 13.5px; box-shadow: 0 1px 2px rgba(15, 15, 15, .06); }
  .banner.bad { background: var(--red-bg); }
  .banner > span:not(.av) { flex: 1; }

  /* file sidebar */
  #files { width: 260px; flex: none; overflow: auto; background: #fbfbfa; border-right: 1px solid var(--line); padding-bottom: 24px; font-size: 13.5px; }
  #files[hidden] { display: none; }
  .files-head { position: sticky; top: 0; background: #fbfbfa; padding: 10px 10px 6px; display: flex; align-items: center; gap: 8px; z-index: 1; }
  .files-head input { flex: 1; min-width: 0; font: inherit; height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; outline: none; }
  .files-head input:focus { box-shadow: 0 0 0 2px rgba(35, 131, 226, .3); border-color: transparent; }
  #files summary, #files .file { display: flex; align-items: center; gap: 6px; height: 28px; padding-right: 8px; margin: 0 4px; border-radius: 4px;
    color: var(--muted); text-decoration: none; cursor: pointer; white-space: nowrap; list-style: none; }
  #files summary::-webkit-details-marker { display: none; }
  #files summary span, #files .file span { overflow: hidden; text-overflow: ellipsis; }
  #files summary:hover, #files .file:hover { background: var(--hover); color: var(--fg); }
  #files .file.on { background: rgba(55, 53, 47, .08); color: var(--fg); font-weight: 500; }
  #files svg { flex: none; opacity: .7; }
  .flat .file { height: auto !important; min-height: 28px; white-space: normal !important; padding: 4px 8px !important; }
  .empty-doc { max-width: 720px; margin: 20vh auto; padding: 0 24px; color: var(--muted); font-size: 16px; }
  .crumb.dir { color: var(--faint); }

  /* side panel */
  aside { width: 340px; flex: none; overflow: auto; border-left: 1px solid var(--line); padding: 4px 14px 24px; background: #fbfbfa; }
  .tabs { display: flex; gap: 2px; position: sticky; top: 0; background: #fbfbfa; padding: 10px 0 8px; z-index: 1; }
  .tabs button { font: inherit; font-size: 13px; border: 0; background: none; padding: 4px 8px; border-radius: 4px; color: var(--muted); cursor: pointer; }
  .tabs button:hover { background: var(--hover); }
  .tabs button.on { color: var(--fg); font-weight: 500; background: var(--hover); }
  .tabs i { font-style: normal; font-size: 11px; background: rgba(55, 53, 47, .12); border-radius: 8px; padding: 0 5px; margin-left: 2px; }
  .empty { color: var(--faint); font-size: 13px; padding: 12px 2px; }
  .card { background: #fff; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; box-shadow: rgba(15, 15, 15, .05) 0 0 0 1px, rgba(15, 15, 15, .04) 0 2px 4px; cursor: default; }
  .card.thread { cursor: pointer; }
  .card.active { box-shadow: 0 0 0 2px rgba(223, 171, 1, .55), rgba(15, 15, 15, .06) 0 3px 8px; }
  .who { display: flex; align-items: center; gap: 8px; }
  .who .meta { margin-left: 2px; }
  .card .msg { color: var(--muted); margin: 6px 0 4px; font-size: 13px; }
  .card q { quotes: none; display: block; border-left: 3px solid var(--yellow); padding-left: 8px; color: var(--muted); font-size: 13px;
    white-space: pre-wrap; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .quote { margin-bottom: 8px; }
  .quote .meta { display: block; margin-top: 2px; }
  .c { margin-top: 10px; }
  .c .body { margin: 2px 0 0 30px; white-space: pre-wrap; word-wrap: break-word; }
  .card textarea, .card input { width: 100%; font: inherit; border: 0; outline: none; resize: none; background: transparent; padding: 4px 0; }
  .compose .who { align-items: flex-start; margin-top: 8px; }
  .compose .actions { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 6px; }
  .reply { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .resolved summary { color: var(--faint); font-size: 13px; cursor: pointer; padding: 6px 2px; }
  .hunk { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; cursor: pointer; display: flex; gap: 8px; align-items: flex-start; }
  .hunk .diff { flex: 1; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .hunk del { background: var(--red-bg); color: #9f2f2d; text-decoration: line-through; border-radius: 3px; padding: 0 2px; margin-right: 4px; }
  .hunk ins { background: var(--green-bg); color: var(--green); text-decoration: none; border-radius: 3px; padding: 0 2px; }
  .hunk.conflict { display: block; }
  .hunk.conflict .label { color: var(--red); font-size: 12.5px; font-weight: 500; margin-bottom: 4px; }
  .hunk.conflict q { border-left-color: var(--red); }
  .choices { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .choices .btn { justify-content: flex-start; overflow: hidden; text-overflow: ellipsis; }

  /* in-editor marks */
  .rl-agent { background: var(--green-bg); box-shadow: 0 2px 0 rgba(68, 131, 97, .35); border-radius: 2px; }
  .rl-del { background: var(--red-bg); color: #9f2f2d; text-decoration: line-through; border-radius: 2px; opacity: .8; }
  .rl-conflict { background: var(--red-bg); box-shadow: 0 2px 0 var(--red); }
  .rl-comment { background: var(--yellow-bg); box-shadow: 0 2px 0 rgba(223, 171, 1, .8); cursor: pointer; }
  .rl-comment.active { background: rgba(255, 212, 0, .4); }
  .cm-tooltip.cm-tooltip-above:has(.sel-tip) { border: 0; background: none; }
  .sel-tip button { font: 13px var(--sans); display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 6px;
    background: #fff; color: var(--fg); box-shadow: var(--pop); cursor: pointer; }
  .sel-tip button:hover { background: #f1f1ef; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="%ENTRY%"></script>
</body>
</html>
